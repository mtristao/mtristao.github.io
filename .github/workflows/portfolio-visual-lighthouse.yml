# Audits the pull request head without deploying or changing GitHub Pages.
# Triggered on PR updates and manual dispatch; no deployment steps.
name: Portfolio visual and Lighthouse audit

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install audit tools
        run: |
          npm install --no-save lighthouse http-server playwright
          npx playwright install --with-deps chromium

      - name: Serve portfolio
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/portfolio-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portfolio-server.log
          exit 1

      - name: Capture desktop and mobile screenshots
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          for (const [name, viewport] of [
            ['desktop', { width: 1440, height: 1000 }],
            ['mobile', { width: 390, height: 844 }]
          ]) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            const layout = await page.evaluate(async () => {
              const images = [...document.images];
              for (const img of images) img.loading = 'eager';
              const imageResults = await Promise.all(images.map(async img => {
                try {
                  await img.decode();
                  return { src: img.currentSrc || img.src, loaded: img.naturalWidth > 0 };
                } catch {
                  return { src: img.currentSrc || img.src, loaded: false };
                }
              }));
              return {
                viewportWidth: window.innerWidth,
                documentWidth: document.documentElement.scrollWidth,
                images: imageResults
              };
            });
            if (layout.documentWidth > layout.viewportWidth) {
              throw new Error(`${name} horizontal overflow: ${layout.documentWidth}px document in ${layout.viewportWidth}px viewport`);
            }
            const brokenImages = layout.images.filter(img => !img.loaded);
            if (brokenImages.length) throw new Error(`${name} images failed to load: ${JSON.stringify(brokenImages)}`);
            await page.screenshot({ path: `portfolio-${name}.png`, fullPage: true });
            if (pageErrors.length) throw new Error(`${name} page errors: ${pageErrors.join('; ')}`);
            await page.close();
          }
          await browser.close();
          NODE

      - name: Test navigation and video dialog interactions
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const failures = [];
          page.on('pageerror', error => failures.push(error.message));
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });

          const menu = page.locator('.mobile-menu-toggle');
          const nav = page.locator('.site-nav');
          const links = page.locator('.site-nav-links a');
          if (await menu.isVisible()) {
            if (await menu.getAttribute('aria-expanded') !== 'false') throw new Error('Mobile menu should start collapsed');
            await menu.click();
            if (await menu.getAttribute('aria-expanded') !== 'true') throw new Error('Mobile menu did not set aria-expanded=true');
            if (!await nav.evaluate(el => el.classList.contains('is-open'))) throw new Error('Mobile menu did not open');
            await links.filter({ hasText: '02 Experience' }).click();
            if (await menu.getAttribute('aria-expanded') !== 'false') throw new Error('Selecting a navigation link did not close the menu');
            await menu.click();
            await page.keyboard.press('Escape');
            if (await menu.getAttribute('aria-expanded') !== 'false') throw new Error('Escape did not close the mobile menu');
          }

          await page.locator('[data-open-bbb-video]').click();
          const dialog = page.locator('#bbb-video-dialog');
          if (!await dialog.evaluate(el => el.open)) throw new Error('Video dialog did not open');
          await page.locator('[data-close-bbb-video]').click();
          if (await dialog.evaluate(el => el.open)) throw new Error('Video dialog did not close');
          if (failures.length) throw new Error(`JavaScript errors: ${failures.join('; ')}`);
          await browser.close();
          NODE

      - name: Run Lighthouse desktop
        run: |
          npx lighthouse http://127.0.0.1:4173/ --preset=desktop --chrome-flags="--headless --no-sandbox" --output=html --output=json --output-path=./lighthouse-desktop

      - name: Run Lighthouse mobile
        run: |
          npx lighthouse http://127.0.0.1:4173/ --chrome-flags="--headless --no-sandbox" --output=html --output=json --output-path=./lighthouse-mobile

      - name: Upload audit reports and screenshots
        uses: actions/upload-artifact@v6
        with:
          name: portfolio-visual-lighthouse-audit
          path: |
            portfolio-desktop.png
            portfolio-mobile.png
            lighthouse-desktop.report.html
            lighthouse-desktop.report.json
            lighthouse-mobile.report.html
            lighthouse-mobile.report.json
          if-no-files-found: error
          retention-days: 14
